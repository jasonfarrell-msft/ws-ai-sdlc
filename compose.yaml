services:
  backend:
    build: ./src/backend
    ports:
      - "127.0.0.1:5050:80"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1/api/health', timeout=5))['status'] == 'healthy'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
  frontend:
    build:
      context: ./src/frontend
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    environment:
      BACKEND_URL: http://backend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"healthy\"'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
