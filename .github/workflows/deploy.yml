name: Validate and deploy

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "infra/**"
      - "SupportDesk.slnx"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "infra/**"
      - "SupportDesk.slnx"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test .NET application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore locked dependencies
        run: dotnet restore SupportDesk.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format SupportDesk.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SupportDesk.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SupportDesk.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/SupportDesk.App/SupportDesk.App.csproj --configuration Release --no-build --output publish

      - name: Start published application
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5050 \
            dotnet publish/SupportDesk.App.dll > /tmp/support-desk.log 2>&1 &
          echo $! > /tmp/support-desk.pid

      - name: Verify published frontend and API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/api/health > /dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat /tmp/support-desk.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5050/ |
            grep --fixed-strings --quiet "Support Desk"
          curl \
            --fail \
            --silent \
            --request POST \
            "http://127.0.0.1:5050/_blazor/negotiate?negotiateVersion=1" |
            grep --fixed-strings --quiet '"connectionToken"'

      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/support-desk.log

      - name: Stop application
        if: always()
        run: |
          if [[ -f /tmp/support-desk.pid ]]; then
            kill "$(cat /tmp/support-desk.pid)" || true
          fi

  infrastructure:
    name: Compile infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Deploy application
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - validate
      - infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workshop-deployment
    concurrency:
      group: workshop-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_WEB_APP
          do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish deployment package
        run: |
          dotnet restore src/SupportDesk.App/SupportDesk.App.csproj --locked-mode
          dotnet publish \
            src/SupportDesk.App/SupportDesk.App.csproj \
            --configuration Release \
            --no-restore \
            --output publish
          (
            cd publish
            zip -r ../support-desk.zip .
          )

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP" \
            --src-path support-desk.zip \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output none

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          application_url="https://${AZURE_WEB_APP}.azurewebsites.net"
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 10 \
            "${application_url}/api/health")"
          grep --fixed-strings --quiet '"status":"healthy"' <<< "$response"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "$application_url" |
            grep --fixed-strings --quiet "Support Desk"
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "${application_url}/_blazor/negotiate?negotiateVersion=1" |
            grep --fixed-strings --quiet '"connectionToken"'
