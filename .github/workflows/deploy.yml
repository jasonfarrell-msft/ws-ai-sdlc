name: Validate and deploy

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "infra/**"
      - "compose.yaml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "infra/**"
      - "compose.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: src/backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest -q

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  infrastructure:
    name: Compile infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  containers:
    name: Test container integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start application containers
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Verify frontend, backend, and same-origin routing
        run: python3 infra/test-containers.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    name: Deploy application
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend
      - frontend
      - infrastructure
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workshop-deployment
    concurrency:
      group: workshop-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
      AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY \
            AZURE_FRONTEND_APP \
            AZURE_BACKEND_APP
          do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build API image in Azure
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "support-desk-api:${GITHUB_SHA}" \
            --platform linux/amd64 \
            --file src/backend/Dockerfile \
            src/backend \
            --output none

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Build frontend image in Azure
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "support-desk-frontend:${GITHUB_SHA}" \
            --platform linux/amd64 \
            --file src/frontend/Dockerfile \
            src/frontend \
            --output none

      - name: Deploy container images
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --query loginServer \
            --output tsv)"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_BACKEND_APP" \
            --image "${login_server}/support-desk-api:${GITHUB_SHA}" \
            --output none
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FRONTEND_APP" \
            --image "${login_server}/support-desk-frontend:${GITHUB_SHA}" \
            --output none

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          host_name="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FRONTEND_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          application_url="https://${host_name}"
          backend_host="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_BACKEND_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          for health_url in \
            "https://${backend_host}/api/health" \
            "${application_url}/api/health"
          do
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 10 \
              "$health_url")"
            python -c \
              'import json, sys; assert json.load(sys.stdin).get("status") == "healthy"' \
              <<< "$response"
          done
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "$application_url" |
            grep --fixed-strings --quiet "Support Desk Simulator"
