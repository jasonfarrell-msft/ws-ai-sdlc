name: Validate and deploy

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: src/backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest -q

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  infrastructure:
    name: Compile infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  integration:
    name: Test combined application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r src/backend/requirements-dev.txt
          npm --prefix src/frontend ci

      - name: Build frontend
        run: npm --prefix src/frontend run build

      - name: Start combined application
        env:
          FRONTEND_DIST_PATH: ${{ github.workspace }}/src/frontend/dist
        run: |
          python -m uvicorn app.main:app \
            --app-dir src/backend \
            --host 127.0.0.1 \
            --port 5050 \
            --no-access-log \
            > /tmp/support-desk.log 2>&1 &
          echo $! > /tmp/support-desk.pid

      - name: Verify frontend and API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/api/health > /dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat /tmp/support-desk.log
              exit 1
            fi
            sleep 1
          done
          python infra/test-application.py

      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/support-desk.log

      - name: Stop application
        if: always()
        run: |
          if [[ -f /tmp/support-desk.pid ]]; then
            kill "$(cat /tmp/support-desk.pid)" || true
          fi

  deploy:
    name: Deploy application
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - backend
      - frontend
      - infrastructure
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: workshop-deployment
    concurrency:
      group: workshop-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_WEB_APP
          do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build deployment package
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix src/frontend ci
          npm --prefix src/frontend run build
          mkdir -p package/app/static
          cp -R src/backend/app/. package/app/
          cp src/backend/requirements.txt package/
          cp -R src/frontend/dist/. package/app/static/
          (
            cd package
            zip -r ../support-desk.zip .
          )

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEB_APP" \
            --src-path support-desk.zip \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --output none

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          application_url="https://${AZURE_WEB_APP}.azurewebsites.net"
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 10 \
            "${application_url}/api/health")"
          python -c \
            'import json, sys; assert json.load(sys.stdin).get("status") == "healthy"' \
            <<< "$response"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "$application_url" |
            grep --fixed-strings --quiet "Support Desk Simulator"
