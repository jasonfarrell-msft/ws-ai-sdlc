name: Frontend

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: frontend-validate-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  package:
    name: Package frontend
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AZURE_BACKEND_URL" =~ ^https://[^/]+$ ]]; then
            echo "::error::AZURE_BACKEND_URL must be an HTTPS origin without a trailing slash."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build deployable frontend
        working-directory: src/frontend
        env:
          VITE_API_BASE_URL: ${{ env.AZURE_BACKEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          grep --recursive --fixed-strings --quiet "$VITE_API_BASE_URL" dist/assets
          (
            cd dist
            zip --quiet --recurse-paths ../frontend.zip .
          )

      - name: Upload frontend package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.sha }}
          path: src/frontend/frontend.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy frontend
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: workshop-frontend
    concurrency:
      group: workshop-frontend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE: ${{ vars.AZURE_APP_SERVICE }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_APP_SERVICE
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Download frontend package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-${{ github.sha }}
          path: deploy

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_SERVICE" \
            --src-path deploy/frontend.zip \
            --type zip \
            --clean true \
            --restart true \
            --output none

          host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_APP_SERVICE" \
            --query defaultHostName \
            --output tsv)"
          echo "frontend_url=https://${host_name}" >> "$GITHUB_OUTPUT"

      - name: Verify frontend
        env:
          FRONTEND_URL: ${{ steps.deploy.outputs.frontend_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "$FRONTEND_URL" |
            grep --fixed-strings --quiet "Support Desk Simulator"
