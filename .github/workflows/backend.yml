name: Backend

on:
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: backend-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: src/backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest -q

  deploy:
    name: Deploy backend
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workshop-backend
    concurrency:
      group: workshop-backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY \
            AZURE_CONTAINER_APP
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Install Container Apps extension
        run: az extension add --name containerapp --version 1.3.0b5 --yes

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build backend image in ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "support-desk-api:${GITHUB_SHA}" \
            --file src/backend/Dockerfile \
            src/backend \
            --output none

      - name: Deploy digest-pinned image
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          digest="$(az acr repository show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --image "support-desk-api:${GITHUB_SHA}" \
            --query digest \
            --output tsv)"
          registry_server="$(az acr show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --query loginServer \
            --output tsv)"
          image="${registry_server}/support-desk-api@${digest}"

          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --image "$image" \
            --output none

          latest_revision="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.latestRevisionName \
            --output tsv)"
          ready_revision=""
          for _ in {1..12}; do
            ready_revision="$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP" \
              --query properties.latestReadyRevisionName \
              --output tsv)"
            [[ "$ready_revision" == "$latest_revision" ]] && break
            sleep 10
          done
          if [[ "$ready_revision" != "$latest_revision" ]]; then
            echo "::error::The new Container App revision did not become ready."
            exit 1
          fi

          actual_image="$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --revision "$latest_revision" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          if [[ "$actual_image" != "$image" ]]; then
            echo "::error::Container App image does not match the digest-pinned build."
            exit 1
          fi

          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          echo "health_url=https://${fqdn}/api/health" >> "$GITHUB_OUTPUT"

      - name: Verify backend health
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.health_url }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "$HEALTH_URL")"
          python -c \
            'import json, sys; assert json.load(sys.stdin).get("status") == "healthy"' \
            <<< "$response"
