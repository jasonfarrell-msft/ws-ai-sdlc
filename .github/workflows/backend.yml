name: Backend

on:
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: backend-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: src/backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend
        run: python -m pytest -q

  deploy:
    name: Deploy backend
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workshop-backend
    concurrency:
      group: workshop-backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_BACKEND_APP_SERVICE: ${{ vars.AZURE_BACKEND_APP_SERVICE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_BACKEND_APP_SERVICE
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub environment variable ${name} is not configured."
              exit 1
            fi
          done

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Package backend
        shell: bash
        run: |
          set -euo pipefail
          (
            cd src/backend
            zip --quiet --recurse-paths ../../backend.zip app requirements.txt
          )

      - name: Deploy backend
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_BACKEND_APP_SERVICE" \
            --src-path backend.zip \
            --type zip \
            --clean true \
            --restart true \
            --output none

          host_name="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_BACKEND_APP_SERVICE" \
            --query defaultHostName \
            --output tsv)"
          echo "health_url=https://${host_name}/api/health" >> "$GITHUB_OUTPUT"

      - name: Verify backend health
        env:
          HEALTH_URL: ${{ steps.deploy.outputs.health_url }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "$HEALTH_URL")"
          python -c \
            'import json, sys; assert json.load(sys.stdin).get("status") == "healthy"' \
            <<< "$response"
